name: DDC Token Records

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ddc-token-records
  cancel-in-progress: false

jobs:
  scan-and-register:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        shell: bash
        env:
          DDC_WRITER_PRIVATE_KEY: ${{ secrets.DDC_WRITER_PRIVATE_KEY }}
        run: |
          if [ -z "$DDC_WRITER_PRIVATE_KEY" ]; then
            echo "Missing DDC_WRITER_PRIVATE_KEY"
            exit 1
          fi

          printf '%s\n' \
            'BSC_MAINNET_RPC_URL=https://bsc-dataseed.bnbchain.org' \
            "DEPLOYER_PRIVATE_KEY=$DDC_WRITER_PRIVATE_KEY" \
            'NEXT_PUBLIC_DDC_TOKEN_RECORDER_ADDRESS=0x9AC7562Cea9D60864bAB9086F825Bb470a666087' \
            'NEXT_PUBLIC_CHAIN_ID=56' \
            > .env.production

      - name: Run DDC Token Records pipeline
        run: ./scripts/runDdcWatchPipeline.sh

      - name: Commit updated state
        shell: bash
        run: |
          git config user.name "DDC Token Records Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/ddc-watch/records.json data/ddc-watch/scans.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update DDC Token record state"
          git push origin HEAD:main
